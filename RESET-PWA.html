<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PixelForge 404</title><style>body{font:16px system-ui;background:#0b0d12;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:560px;padding:28px;border:1px solid #30384b;border-radius:16px;background:#121620}small{color:#aab2c5}</style></head>
<body><main><h1>PixelForge 404</h1><p id="state">Limpiando cachés y Service Workers antiguos…</p><small>Esta utilidad solo es necesaria si una release antigua continúa apareciendo después de actualizar.</small></main><script>(async()=>{const s=document.getElementById('state');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('pixelforge-404-')).map(k=>caches.delete(k)))}s.textContent='Limpieza completada. Abriendo PixelForge v7.0.0…';setTimeout(()=>location.replace('./index.html?pf=7.0.0'),500)}catch(e){s.textContent='No se pudo limpiar automáticamente. Cierra las pestañas de PixelForge y borra los datos del sitio desde el navegador.'}})();</script></body></html>
